name: Build semua installer

# Jalankan manual dari tab Actions, atau otomatis saat kamu push tag v*.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ELECTRON_VER: v31.7.7
  APP_VER: "1.12.0"

jobs:
  # ---------------------------------------------------------------- WINDOWS
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ia32            # jalan di Windows 32-bit maupun 64-bit
            asset: AzurePet-Windows-x86-Setup.exe
          - arch: arm64
            asset: AzurePet-Windows-arm64-Setup.exe
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan aplikasi Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/electron/electron/releases/download/$env:ELECTRON_VER/electron-$env:ELECTRON_VER-win32-${{ matrix.arch }}.zip"
          Invoke-WebRequest $url -OutFile electron.zip
          Expand-Archive electron.zip -DestinationPath win -Force
          Rename-Item win/electron.exe AzurePet.exe
          Remove-Item win/resources/default_app.asar -ErrorAction SilentlyContinue
          New-Item -ItemType Directory win/resources/app -Force | Out-Null
          Copy-Item -Recurse -Force AzurePet-source/* win/resources/app/
          Remove-Item win/resources/app/installer.nsi -ErrorAction SilentlyContinue
          Remove-Item win/resources/app/icon.ico -ErrorAction SilentlyContinue
          # sisakan 2 bahasa saja supaya kecil
          Get-ChildItem win/locales -Filter *.pak | Where-Object { $_.Name -notin @("en-US.pak","id.pak") } | Remove-Item

      - name: Ikon dan versi file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          $icon = (Resolve-Path AzurePet-source/icon.ico).Path
          & ./rcedit.exe win/AzurePet.exe --set-icon $icon `
              --set-file-version $env:APP_VER --set-product-version $env:APP_VER `
              --set-version-string ProductName AzurePet `
              --set-version-string FileDescription AzurePet `
              --set-version-string CompanyName AzurePet `
              --set-version-string OriginalFilename AzurePet.exe

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nsis -y --no-progress | Out-Null
          Copy-Item AzurePet-source/installer.nsi .
          Copy-Item AzurePet-source/icon.ico .
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 installer.nsi
          if (!(Test-Path AzurePet-Setup.exe)) { throw "NSIS gagal membuat installer" }
          Rename-Item AzurePet-Setup.exe "${{ matrix.asset }}"
          Get-Item "${{ matrix.asset }}" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            asset: AzurePet-x64.dmg
          - arch: arm64
            asset: AzurePet-arm64.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan AzurePet.app
        run: |
          set -euo pipefail
          curl -sSL -o electron.zip "https://github.com/electron/electron/releases/download/${ELECTRON_VER}/electron-${ELECTRON_VER}-darwin-${{ matrix.arch }}.zip"
          unzip -q electron.zip -d mac
          mv mac/Electron.app mac/AzurePet.app
          APP=mac/AzurePet.app
          rm -f "$APP/Contents/Resources/default_app.asar" "$APP/Contents/Resources/electron.icns"
          mkdir -p "$APP/Contents/Resources/app"
          cp -R AzurePet-source/. "$APP/Contents/Resources/app/"
          rm -f "$APP/Contents/Resources/app/installer.nsi" "$APP/Contents/Resources/app/icon.ico"
          rm -rf "$APP/Contents/Resources/app/bin"
          mv "$APP/Contents/MacOS/Electron" "$APP/Contents/MacOS/AzurePet"

      - name: Ikon .icns dari icon.png
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size AzurePet-source/icon.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size*2)) $((size*2)) AzurePet-source/icon.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o azurepet.icns
          cp azurepet.icns mac/AzurePet.app/Contents/Resources/azurepet.icns

      - name: Info.plist
        run: |
          set -euo pipefail
          P=mac/AzurePet.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName AzurePet" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName AzurePet" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable AzurePet" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile azurepet.icns" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.azurepet.app" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VER}" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${APP_VER}" "$P"
          /usr/libexec/PlistBuddy -c "Set :LSApplicationCategoryType public.app-category.entertainment" "$P"
          /usr/libexec/PlistBuddy -c "Delete :ElectronAsarIntegrity" "$P" 2>/dev/null || true
          # helper butuh CFBundleExecutable supaya bisa di-sign
          for helper in mac/AzurePet.app/Contents/Frameworks/*.app; do
            HP="$helper/Contents/Info.plist"
            EXE=$(ls "$helper/Contents/MacOS" | head -1)
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $EXE" "$HP" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string $EXE" "$HP"
          done

      - name: Tanda tangan ad-hoc + buat DMG
        run: |
          set -euo pipefail
          codesign --force --deep --sign - mac/AzurePet.app
          rm -rf stage && mkdir stage
          cp -R mac/AzurePet.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname AzurePet -srcfolder stage -ov -format UDZO "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # ------------------------------------------------------------------ LINUX
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            debarch: amd64
            asset: AzurePet-Linux-x64.deb
          - arch: arm64
            debarch: arm64
            asset: AzurePet-Linux-arm64.deb
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan paket .deb
        run: |
          set -euo pipefail
          curl -sSL -o electron.zip "https://github.com/electron/electron/releases/download/${ELECTRON_VER}/electron-${ELECTRON_VER}-linux-${{ matrix.arch }}.zip"
          rm -rf pkg && mkdir -p pkg/opt/AzurePet pkg/usr/bin pkg/usr/share/applications pkg/DEBIAN
          mkdir -p pkg/usr/share/icons/hicolor/256x256/apps
          unzip -q electron.zip -d pkg/opt/AzurePet
          mv pkg/opt/AzurePet/electron pkg/opt/AzurePet/AzurePet
          rm -f pkg/opt/AzurePet/resources/default_app.asar
          ( cd pkg/opt/AzurePet/locales && ls | grep -v -E '^(en-US|id)\.pak$' | xargs -r rm -f )
          mkdir -p pkg/opt/AzurePet/resources/app
          cp -R AzurePet-source/. pkg/opt/AzurePet/resources/app/
          rm -f pkg/opt/AzurePet/resources/app/installer.nsi pkg/opt/AzurePet/resources/app/icon.ico
          rm -rf pkg/opt/AzurePet/resources/app/bin
          cp AzurePet-source/icon.png pkg/usr/share/icons/hicolor/256x256/apps/azurepet.png

          printf '%s\n' '#!/bin/sh' 'exec /opt/AzurePet/AzurePet --ozone-platform=x11 "$@"' > pkg/usr/bin/azurepet
          chmod 755 pkg/usr/bin/azurepet

          cat > pkg/usr/share/applications/azurepet.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=AzurePet
          GenericName=Desktop Pet
          Comment=Karakter 3D yang berjalan-jalan di desktop
          Exec=azurepet
          Icon=azurepet
          Terminal=false
          Categories=Utility;Amusement;
          StartupWMClass=AzurePet
          DESK

          cat > pkg/DEBIAN/control <<CTRL
          Package: azurepet
          Version: ${APP_VER}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.debarch }}
          Maintainer: AzurePet <azurepet@example.com>
          Installed-Size: 260000
          Depends: libgtk-3-0t64 | libgtk-3-0, libnss3, libasound2t64 | libasound2, libgbm1, libxss1, libxtst6, libatk1.0-0t64 | libatk1.0-0, libatk-bridge2.0-0t64 | libatk-bridge2.0-0, libcups2t64 | libcups2, libdrm2, libxkbcommon0, libpango-1.0-0, libcairo2, libxcomposite1, libxdamage1, libxfixes3, libxrandr2, libx11-6, libxext6
          Description: AzurePet - karakter 3D di desktop
           AzurePet menampilkan karakter 3D (.glb) yang berjalan-jalan di desktop.
          CTRL

          printf '%s\n' '#!/bin/sh' 'set -e' \
            'if [ -f /opt/AzurePet/chrome-sandbox ]; then chown root:root /opt/AzurePet/chrome-sandbox 2>/dev/null || true; chmod 4755 /opt/AzurePet/chrome-sandbox 2>/dev/null || true; fi' \
            'command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications 2>/dev/null || true' \
            'command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true' \
            'exit 0' > pkg/DEBIAN/postinst
          chmod 755 pkg/DEBIAN/postinst

          dpkg-deb --build --root-owner-group pkg "${{ matrix.asset }}"
          ls -l "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------- RILIS
  release:
    name: Buat Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Daftar file
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: AzurePet ${{ env.APP_VER }}
          body: |
            ## AzurePet ${{ env.APP_VER }}

            Karakter 3D yang berjalan-jalan di desktop.

            - **macOS** — `AzurePet-arm64.dmg` (Apple Silicon) / `AzurePet-x64.dmg` (Intel)
              Buka DMG, klik kanan app → Open → Open. Aplikasi menyalin dirinya ke Applications.
            - **Windows 10/11** — `AzurePet-Windows-x86-Setup.exe` (32 & 64-bit) / `AzurePet-Windows-arm64-Setup.exe`
            - **Linux 64-bit** — `AzurePet-Linux-x64.deb` / `AzurePet-Linux-arm64.deb`

            Aplikasi belum ditandatangani secara digital, jadi Windows/macOS memberi peringatan sekali
            saat pertama dijalankan. Kode sumber lengkap ada di repo ini.
          files: dist/*
          fail_on_unmatched_files: true
